name: stela_mobile
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get_it: ^9.2.1
  injectable: ^2.7.1+4
  shared_preferences: ^2.5.4
  logger: ^2.7.0
  provider: ^6.1.5+1
  sprung: ^3.0.1
  gap: ^3.0.1
  flutter_animate: ^4.5.2
  loading_animation_widget: ^1.3.0
  fast_cached_network_image: ^1.3.3+5
  flutter_svg: ^2.2.4
  intl: ^0.20.2
  another_flushbar: ^1.12.32
  flutter_staggered_grid_view: ^0.7.0
  fl_chart: ^1.2.0
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  google_sign_in: ^7.2.0
  flutter_tts: ^4.2.5
  cloud_firestore: ^6.3.0
  flutter_dotenv: ^6.0.1
  otp_text_field_v2: ^1.0.3
  gif_view: ^1.0.3
  json_annotation: ^4.11.0
  json_serializable: ^6.13.2
  toastification: ^3.2.0
  just_audio: ^0.10.5
  dio: ^5.9.2
  retrofit: ^4.9.2
  awesome_dio_interceptor: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.13.1
  injectable_generator: ^2.9.0
  flutter_lints: ^6.0.0
  retrofit_generator: ^10.2.1


flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/vectors/
    - assets/fonts/
    - assets/env/
    - assets/gifs/


  # example:
  fonts:
    - family: SFProRounded
      fonts:
      - asset: assets/fonts/SF-Pro-Rounded-Light.otf
        weight: 400
      - asset: assets/fonts/SF-Pro-Rounded-Regular.otf 
        weight: 500
      - asset: assets/fonts/SF-Pro-Rounded-Bold.otf
        weight: 600
